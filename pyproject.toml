[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pnitrerman-rlrsr_jd366"
version = "0.1.0"
description = "从输入中抽取数值，计算强化学习研究员·模型热切换的一致性相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pnitrerman" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pnitrerman.github.io"
Repository = "https://github.com/pnitrerman/rlrsr_jd366"
Issues = "https://github.com/pnitrerman/rlrsr_jd366/issues"

[project.scripts]
rlrsr_jd366 = "rlrsr_jd366:main"

[tool.setuptools]
py-modules = ["rlrsr_jd366"]
